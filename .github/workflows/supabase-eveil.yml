name: Éveil Supabase

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller la base
        run: |
          reponse=$(curl -sS -w '\n%{http_code}' -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          code=$(echo "$reponse" | tail -n 1)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::la base n'a pas répondu 200"
            exit 1
          fi
